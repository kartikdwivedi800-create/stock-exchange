spring:
  application:
    name: wallet-service
  datasource:
    # Own database per service (ADR-0003). DB_HOST/DB_PORT are shared; DB_NAME/USERNAME/PASSWORD are per service.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_db}
    username: ${DB_USERNAME:wallet_service}
    password: ${DB_PASSWORD:wallet_service}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Runs pending scripts from classpath:db/migration at startup, before Hibernate validates
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks entities match it
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
