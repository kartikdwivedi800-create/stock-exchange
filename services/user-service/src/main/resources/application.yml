spring:
  application:
    name: user-service
  datasource:
    # Own database per service (ADR-0003). DB_HOST/DB_PORT are shared; DB_NAME/USERNAME/PASSWORD are per service.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:user_service}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Runs pending scripts from classpath:db/migration at startup, before Hibernate validates
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks entities match it
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

nexus:
  security:
    jwt:
      issuer: nexus-exchange
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}   # HS256 needs >= 32 bytes
      access-token-ttl: 15m
    refresh-token-ttl: 7d
    login:
      max-failed-attempts: 5
      lock-duration: 15m