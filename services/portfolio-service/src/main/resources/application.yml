spring:
  application:
    name: portfolio-service
  datasource:
    # Own database per service (ADR-0003). DB_HOST/DB_PORT are shared; DB_NAME/USERNAME/PASSWORD are per service.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio_db}
    username: ${DB_USERNAME:portfolio_service}
    password: ${DB_PASSWORD:portfolio_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
