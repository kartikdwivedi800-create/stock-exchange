<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Market simulator</title><style>
text{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#17201C}
.h{font-size:17px;font-weight:700} .b{font-size:15px} .s{font-size:14px;fill:#55625B} .m{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:14px}
.lab{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#55625B} .hA{font-size:17px;font-weight:700;fill:#B06F12}
.nt{font-size:13px;font-weight:700;fill:#fff}
.box{fill:#fff;stroke:#17201C;stroke-width:1.5} .dash{fill:#fff;stroke:#55625B;stroke-width:1.5;stroke-dasharray:6 4}
