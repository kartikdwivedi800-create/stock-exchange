</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahA"/></marker></defs><rect width="1000" height="476" fill="#FFFFFF"/><rect x="20" y="24" width="300" height="56" rx="8" class="db"/><text x="170" y="48" class="m" text-anchor="middle">stocks-seed.json</text><text x="170" y="70" class="s" text-anchor="middle">last close · σ · avg volume</text><rect x="360" y="24" width="300" height="56" rx="8" class="box"/><text x="510" y="48" class="h" text-anchor="middle">Fair-value engine</text><text x="510" y="70" class="s" text-anchor="middle">GBM or historical replay</text><rect x="700" y="24" width="280" height="56" rx="8" class="bus"/><text x="840" y="48" class="m" text-anchor="middle">price-events</text><text x="840" y="70" class="s" text-anchor="middle">last traded price (LTP)</text><line x1="320" y1="52" x2="358" y2="52" class="ln" marker-end="url(#a)"/><rect x="20" y="150" width="215" height="64" rx="8" class="box"/><text x="127" y="176" class="h" text-anchor="middle">Market makers</text><text x="127" y="200" class="s" text-anchor="middle">quote bid/ask around FV</text><rect x="255" y="150" width="215" height="64" rx="8" class="box"/><text x="362" y="176" class="h" text-anchor="middle">Noise traders</text><text x="362" y="200" class="s" text-anchor="middle">random small orders</text><rect x="490" y="150" width="215" height="64" rx="8" class="box"/><text x="597" y="176" class="h" text-anchor="middle">Value traders</text><text x="597" y="200" class="s" text-anchor="middle">trade toward FV</text><rect x="725" y="150" width="215" height="64" rx="8" class="box"/><text x="832" y="176" class="h" text-anchor="middle">Momentum traders</text><text x="832" y="200" class="s" text-anchor="middle">follow LTP trend</text><line x1="510" y1="80" x2="127" y2="148" class="ln" marker-end="url(#a)"/><line x1="510" y1="80" x2="362" y2="148" class="ln" marker-end="url(#a)"/><line x1="510" y1="80" x2="597" y2="148" class="ln" marker-end="url(#a)"/><line x1="840" y1="80" x2="832" y2="148" class="as" marker-end="url(#b)"/><text x="600" y="122" class="s" text-anchor="start">fair value (hidden from users)</text><rect x="200" y="280" width="600" height="60" rx="8" class="box"/><text x="500" y="305" class="h" text-anchor="middle">Order scheduler</text><text x="500" y="328" class="s" text-anchor="middle">per-bot balance · max orders/s · ±10% circuit breaker</text><line x1="127" y1="214" x2="275" y2="278" class="ln" marker-end="url(#a)"/><line x1="362" y1="214" x2="425" y2="278" class="ln" marker-end="url(#a)"/><line x1="597" y1="214" x2="575" y2="278" class="ln" marker-end="url(#a)"/><line x1="832" y1="214" x2="725" y2="278" class="ln" marker-end="url(#a)"/><rect x="200" y="400" width="600" height="56" rx="8" class="hl"/><text x="500" y="425" class="h" text-anchor="middle">API Gateway → order-service → matching-engine</text><text x="500" y="446" class="s" text-anchor="middle">bots are normal users (ROLE_BOT) on the same path</text><line x1="500" y1="340" x2="500" y2="398" class="ln" marker-end="url(#a)"/><text x="512" y="374" class="s" text-anchor="start">REST /api/v1/orders</text><path d="M 800 428 H 965 V 82" class="as" marker-end="url(#b)"/><text x="955" y="250" class="s" text-anchor="end">trades</text><text x="955" y="270" class="s" text-anchor="end">move LTP</text></svg>